name: Android quality gates

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify bundled Nothing Glyph Matrix SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "be00ee9cd7115f6b11984c6e31fe98e298fb726940d1555063610685ef3bbf29  app/libs/glyph-matrix-sdk-2.0.aar" | sha256sum --check --strict

      - name: Unit tests, lint, and APKs
        shell: bash
        run: |
          set -euo pipefail
          tasks=(testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest)
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            tasks+=(assembleRelease)
          fi
          ./gradlew --build-cache --parallel "${tasks[@]}"

      - name: Add build summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Android quality gates"
            echo "- Unit tests"
            echo "- Android lint"
            echo "- Debug APK"
            echo "- Android test APK"
            if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
              echo "- Release APK"
            else
              echo "- Release APK deferred to master"
            fi
            echo "- Gradle wrapper validation"
            echo "- Bundled Nothing SDK checksum verification"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nothing-playbox-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-quality-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  instrumentation:
    name: Android instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install API 35 emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name playbox-ci --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          nohup emulator -avd playbox-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run instrumentation tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --build-cache connectedDebugAndroidTest

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 7
