name: Android quality gates

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify bundled Nothing Glyph Matrix SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "be00ee9cd7115f6b11984c6e31fe98e298fb726940d1555063610685ef3bbf29  app/libs/glyph-matrix-sdk-2.0.aar" | sha256sum --check --strict

      - name: Unit tests, lint, debug and release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --build-cache --parallel \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            assembleDebugAndroidTest \
            assembleRelease

      - name: Add build summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Android quality gates"
            echo "- Unit tests"
            echo "- Android lint"
            echo "- Debug APK"
            echo "- Android test APK"
            echo "- Release APK"
            echo "- Gradle wrapper validation"
            echo "- Bundled Nothing SDK checksum verification"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nothing-playbox-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-quality-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 30

  instrumentation:
    name: Android instrumentation tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo "/dev/kvm is unavailable on this runner" >&2; exit 1; }
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Restore Android emulator quick-boot state
        id: avd-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: android-avd-v1-api35-google_apis-x86_64

      - name: Download prebuilt app and test APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nothing-playbox-apks
          path: ci-apks

      - name: Run instrumentation tests on API 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          CI_APK_DIR: ci-apks
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          force-avd-creation: false
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics -gpu swiftshader_indirect
          script: bash .github/scripts/run-instrumentation.sh

      - name: Upload instrumentation output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-instrumentation-output
          path: instrumentation-output.txt
          if-no-files-found: ignore
          retention-days: 30
