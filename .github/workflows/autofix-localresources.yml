name: One-shot LocalResources lint fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'audit/fix-all-p0-p4' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Apply configuration-aware resource lookups
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, expected=None):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences of {old!r}, found {count}")
              if count == 0:
                  raise SystemExit(f"{path}: pattern not found: {old!r}")
              file.write_text(text.replace(old, new))

          main = "app/src/main/java/com/agentkosticka/playbox/MainActivity.kt"
          replace(main,
              "import androidx.compose.ui.graphics.Color\n",
              "import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.platform.LocalResources\n",
              1)
          replace(main,
              "    val context = androidx.compose.ui.platform.LocalContext.current\n    val resolver = context.contentResolver\n",
              "    val context = androidx.compose.ui.platform.LocalContext.current\n    val resources = LocalResources.current\n    val resolver = context.contentResolver\n",
              1)
          replace(main, "context.getString(", "resources.getString(", 8)

          aod = "app/src/main/java/com/agentkosticka/playbox/AodScreen.kt"
          replace(aod,
              "import androidx.compose.ui.platform.LocalContext\n",
              "import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalResources\n",
              1)
          replace(aod,
              "    val context = LocalContext.current\n",
              "    val context = LocalContext.current\n    val resources = LocalResources.current\n",
              1)
          replace(aod, "context.getString(", "resources.getString(", 1)

          widgets = "app/src/main/java/com/agentkosticka/playbox/WidgetsScreen.kt"
          replace(widgets,
              "import androidx.compose.ui.platform.LocalContext\n",
              "import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalResources\n",
              1)
          replace(widgets,
              "    val context = LocalContext.current\n    Button(\n",
              "    val context = LocalContext.current\n    val resources = LocalResources.current\n    Button(\n",
              1)
          replace(widgets, "context.getString(", "resources.getString(", 2)

          Path(".github/workflows/autofix-localresources.yml").unlink()

      - name: Commit lint fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix configuration-aware Compose resource access"
          git push origin HEAD:${{ github.head_ref }}
