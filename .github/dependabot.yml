version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 8
    groups:
      android-build-toolchain:
        patterns:
          - "com.android.tools.build:*"
          - "org.jetbrains.kotlin:*"
      compose-ui:
        patterns:
          - "androidx.compose:*"
          - "androidx.activity:*"
      android-runtime:
        patterns:
          - "androidx.core:*"
          - "androidx.lifecycle:*"
          - "androidx.work:*"
      android-test:
        patterns:
          - "androidx.test:*"
          - "junit:junit"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
