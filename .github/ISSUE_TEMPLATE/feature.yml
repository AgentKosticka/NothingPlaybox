name: Feature request
description: Suggest an improvement that keeps the Glyph Matrix experience focused and useful
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: idea
    attributes:
      label: What should improve?
      description: Explain the user problem or creative opportunity, not just the implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Matrix editor / frame animation
        - Procedural engine / profile
        - Home-screen widgets
        - Video / image import
        - Effect import / export / storage
        - Glyph Matrix hardware output
        - Always-on Glyph Toy
        - App polish / usability / accessibility
        - Build / release / repository developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: What would the ideal interaction feel like with as little mental overhead as possible?
    validations:
      required: true
