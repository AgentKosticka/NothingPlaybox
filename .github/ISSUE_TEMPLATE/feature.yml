name: Feature request
description: Suggest an improvement that keeps the Glyph Matrix at the center
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: idea
    attributes:
      label: What should improve?
      description: Explain the user problem or creative opportunity, not just the implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Animation / built-in effect
        - Pixel Lab editor
        - Video / image import
        - Glyph Matrix hardware output
        - Always-on Glyph Toy
        - App polish / usability
        - Repository / developer experience
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: What would the ideal interaction feel like with as little mental overhead as possible?
