name: Bug report
description: Report a reproducible Nothing Playbox problem
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Matrix editor / frame animation
        - Procedural engine / profile
        - Home-screen widget
        - Glyph Matrix live hardware output
        - Always-on Glyph Toy
        - Video import
        - Image import
        - Effect import / export
        - Storage / saved library
        - Simulator / general app UI
        - Build / CI / repository tooling
        - Other
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Playbox version or commit
      placeholder: e.g. 1.1.0 or commit SHA
  - type: input
    id: os
    attributes:
      label: Nothing OS / Android version
      placeholder: e.g. Nothing OS build / Android version
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Logs, media details, screenshots, widget launcher, or anything else useful.
