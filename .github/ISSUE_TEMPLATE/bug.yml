name: Bug report
description: Report a reproducible Nothing Playbox problem
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Glyph Matrix hardware output
        - Always-on Glyph Toy
        - Pixel Lab editor
        - Video import
        - Image import
        - Effect import/export
        - Simulator / app UI
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Nothing OS version
      placeholder: e.g. Nothing OS build / Android version
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Logs, media details, screenshots, or anything else useful.
